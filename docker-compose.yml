services:
  mysql:
    image: mysql:8.4
    container_name: word-intelligence-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DB:-word_intelligence}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: word-intelligence-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - MYSQL_SERVER=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret}
      - MYSQL_DB=${MYSQL_DB:-word_intelligence}
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://root:${MYSQL_PASSWORD:-secret}@mysql:3306/${MYSQL_DB:-word_intelligence}?charset=utf8mb4
      - BACKEND_CORS_ORIGINS=["http://localhost","http://localhost:80","http://127.0.0.1"]
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS_PER_MINUTE=120
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: word-intelligence-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

volumes:
  mysql_data:
    name: word_intelligence_mysql_data

networks:
  app_network:
    name: word_intelligence_network
